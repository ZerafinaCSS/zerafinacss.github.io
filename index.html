<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZerafinaCSS</title>
    <link rel="icon" type="image/x-icon" href="https://avatars.githubusercontent.com/u/181578567">
    <style>

      :root  {
        --border-radius: 1em;
        --gap: 0.65em;
      }

      @media (prefers-color-scheme: light)  {
        :root  {
          --background-color-main: #FFFFFF;
          --background-image-main: radial-gradient(85% 65% at 8% 8%, rgba(175, 109, 255, 0.42), transparent 60%), radial-gradient(75% 60% at 75% 35%, rgba(255, 235, 170, 0.55), transparent 62%), radial-gradient(70% 60% at 15% 80%, rgba(255, 100, 180, 0.4), transparent 62%), radial-gradient(70% 60% at 92% 92%, rgba(120, 190, 255, 0.45), transparent 62%), linear-gradient(rgb(247, 234, 255) 0%, rgb(253, 226, 234) 100%);
          --background-color-card: #FFFFFF30;
          --text-primary: #342029;
          --text-secondary: #34202980;
          --box-shadow-color: #92145730;
          --highlight: #921457;
          --border-color: #FFFFFF90
        }
      }

      @media (prefers-color-scheme: dark)  {
        :root  {
          --background-color-main: #342029;
          --background-image-main: radial-gradient(120% 80% at 70% 20%, rgba(255, 20, 147, 0.15), transparent 50%), radial-gradient(100% 60% at 30% 10%, rgba(0, 255, 255, 0.12), transparent 60%), radial-gradient(90% 70% at 50% 0%, rgba(138, 43, 226, 0.18), transparent 65%), radial-gradient(110% 50% at 80% 30%, rgba(255, 215, 0, 0.08), transparent 40%), none;
          --background-color-card: #532b4120;
          --text-primary: #EEEEEE;
          --text-secondary: #EFE6E990;
          --box-shadow-color: #4d001b40;
          --highlight: #AB467C;
          --border-color: #FFFFFF10;
        }
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      *::selection {
        background-color: var(--highlight);
        color: var(--background-color-main);
      }

      body  {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: var(--background-color-main);
        background-image: var(--background-image-main);
        font-family: Verdana, Arial, sans-serif;
      }

      .card  {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--gap);
        width: 250px;
        max-width: 90vw;
        margin-bottom: 35vh;
        padding: 2em;
        border: 1px solid var(--border-color);
        border-radius: var(--border-radius);
        background: var(--background-color-card);
        box-shadow: 0 5px 20px 0 var(--box-shadow-color);
        text-align: center;
        color: var(--text-primary);
        overflow-wrap: anywhere;
      }

      .user-icon  {
        width: 60px;
        margin-bottom: var(--gap);
        border-radius: 100%;
      }

      h1  {
        margin: 0;
        font-size: 1.6em;
        font-weight: 700;
      }

      .secondary  {
        color: var(--text-secondary);
        font-size: 0.9em;
      }

      .socials {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.75em;
        margin-top: var(--gap);
        line-height: 0;
      }

      .icon svg {
        height: 1.25em;
        stroke: var(--text-primary);
        stroke-width: 0.4px;
        fill: var(--text-primary);
        overflow: visible;
      }

      .icon svg:is(:hover, :focus) {
        stroke: var(--highlight);
        fill: var(--highlight);
      }

    </style>
  </head>

  <body>

      <h1>ZerafinaCSS</h1>
